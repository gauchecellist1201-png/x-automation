name: CORE Social Drafts

on:
  schedule:
    - cron: '7 23 * * *'   # around 08:07 JST daily
    - cron: '22 23 * * 0' # around Monday 08:22 JST weekly
  workflow_dispatch:
    inputs:
      kind:
        description: Draft to deliver
        required: true
        default: daily
        type: choice
        options:
          - daily
          - weekly
  pull_request:
    paths:
      - social.py
      - tests/**
      - .github/workflows/social.yml

permissions:
  contents: read

jobs:
  drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test draft generation
        run: python -m unittest discover -s tests -v
      - name: Send LINE draft
        if: github.event_name != 'pull_request'
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          DRAFT_KIND: ${{ github.event_name == 'workflow_dispatch' && inputs.kind || (github.event.schedule == '22 23 * * 0' && 'weekly' || 'daily') }}
        run: python social.py
