name: X Auto Post

on:
  schedule:
    # 毎日 JST 12:00 (UTC 03:00) — 昼休みのエンゲージメント最高時間帯
    - cron: "0 3 * * *"
    # 毎日 JST 21:00 (UTC 12:00) — 夜のエンゲージメントピーク
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "生成モード (rss / thread / original)"
        required: false
        default: "rss"

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run auto post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python main.py

      - name: Commit posted_log.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_log.txt
          git diff --cached --quiet || git commit -m "chore: update posted_log [skip ci]"
          git push
