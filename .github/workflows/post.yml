name: X Auto Post

on:
  schedule:
    # 毎日 JST 21:00 (UTC 12:00) に実行（エンゲージメント最高時間帯）
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      auto_post:
        description: "X自動投稿する (true/false)"
        required: false
        default: "false"
      use_thread:
        description: "スレッド形式で投稿 (true/false)"
        required: false
        default: "false"

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write # posted_log.txt をコミットするために必要

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run auto post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          AUTO_POST_TO_X: ${{ github.event.inputs.auto_post || 'false' }}
          USE_THREAD_POST: ${{ github.event.inputs.use_thread || 'false' }}
        run: python main.py

      - name: Commit posted_log.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_log.txt
          git diff --cached --quiet || git commit -m "chore: update posted_log [skip ci]"
          git push
